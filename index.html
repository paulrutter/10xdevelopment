  <style>
    :root {
      --bg: #f7f8fa;
      --panel: #ffffff;
      --text: #10131a;
      --muted: #5b6472;
      --accent: #2f6df6;
      --border: #e6e9ef;
      --shadow: 0 20px 60px rgba(16, 19, 26, 0.08);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0c0e13;
        --panel: #14171f;
        --text: #f2f4f8;
        --muted: #9aa4b2;
        --accent: #5b8bff;
        --border: #232734;
        --shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      }
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background:
        radial-gradient(1200px 600px at 50% -10%, color-mix(in srgb, var(--accent) 14%, transparent), transparent 60%),
        var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: var(--shadow);
      max-width: 520px;
      width: 100%;
      padding: 48px 40px;
      text-align: center;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: var(--accent);
      background: color-mix(in srgb, var(--accent) 12%, transparent);
      padding: 6px 14px;
      border-radius: 999px;
      margin-bottom: 28px;
    }

    h1 {
      font-size: clamp(28px, 6vw, 40px);
      line-height: 1.1;
      margin: 0 0 12px;
      letter-spacing: -0.02em;
    }

    p.lead {
      color: var(--muted);
      font-size: 17px;
      line-height: 1.6;
      margin: 0 0 32px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      font-weight: 600;
      font-size: 16px;
      padding: 14px 26px;
      border-radius: 12px;
      transition: transform 0.12s ease, box-shadow 0.12s ease, opacity 0.12s ease;
      box-shadow: 0 8px 20px color-mix(in srgb, var(--accent) 35%, transparent);
    }
    .btn:hover { transform: translateY(-2px); opacity: 0.95; }
    .btn:active { transform: translateY(0); }
    .btn svg { width: 20px; height: 20px; fill: currentColor; }

    a:focus-visible, .btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
      border-radius: 12px;
    }

    @media (prefers-reduced-motion: reduce) {
      .btn { transition: none; }
      .btn:hover { transform: none; }
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }

    .btn.secondary {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
      box-shadow: none;
    }
    .btn.secondary:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .footer {
      margin-top: 32px;
      font-size: 13px;
      color: var(--muted);
    }
    .footer a { color: var(--muted); }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">⚡ 10x Development</span>

    <h1>Paul Rütter</h1>
    <p class="lead">
      Director of Technology at BlueConic. This is the personal home of my
      projects and code — find me on the links below.
    </p>

        <svg viewBox="0 0 16 16" aria-hidden="true">

    <div class="footer">
      &copy; <span id="year">2026</span> Paul Rütter · 10xdevelopment.nl
    </div>
  </main>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
