<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests" />
  <title>404 — route returned null · 10x Development</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#f7f8fa" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0c0e13" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>" />

  <!-- Apply saved theme before paint to avoid a flash -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>

  <style>
    :root {
      --bg: #f7f8fa;
      --panel: #ffffff;
      --text: #10131a;
      --muted: #5b6472;
      --accent: #2f6df6;
      --border: #e6e9ef;
      --shadow: 0 20px 60px rgba(16, 19, 26, 0.08);
    }
    :root[data-theme="dark"] {
      --bg: #0c0e13; --panel: #14171f; --text: #f2f4f8; --muted: #9aa4b2;
      --accent: #5b8bff; --border: #232734; --shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme]) {
        --bg: #0c0e13; --panel: #14171f; --text: #f2f4f8; --muted: #9aa4b2;
        --accent: #5b8bff; --border: #232734; --shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background:
        radial-gradient(1200px 600px at 50% -10%, color-mix(in srgb, var(--accent) 14%, transparent), transparent 60%),
        var(--bg);
      color: var(--text);
      display: flex; align-items: center; justify-content: center;
      padding: 24px; -webkit-font-smoothing: antialiased;
    }
    .card {
      background: var(--panel); border: 1px solid var(--border);
      border-radius: 20px; box-shadow: var(--shadow);
      max-width: 560px; width: 100%; padding: 44px 40px; text-align: center;
    }
    .code {
      font-size: clamp(64px, 18vw, 120px); font-weight: 800; line-height: 1;
      letter-spacing: -0.04em; margin: 0;
      background: linear-gradient(180deg, var(--accent), color-mix(in srgb, var(--accent) 55%, var(--text)));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    h1 { font-size: clamp(20px, 4vw, 26px); margin: 12px 0 0; letter-spacing: -0.02em; }
    p.lead { color: var(--muted); font-size: 16px; line-height: 1.6; margin: 12px 0 26px; }
    .term {
      text-align: left; background: #0c0e13; border: 1px solid #232734;
      border-radius: 12px; padding: 16px 18px; margin: 0 0 28px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13.5px; line-height: 1.6; color: #e6e9ef; overflow-x: auto;
    }
    .term .accent { color: #4ade80; }
    .term .muted { color: #9aa4b2; }
    .term .err { color: #ff8a8a; }
    .btn {
      display: inline-flex; align-items: center; gap: 10px;
      background: var(--accent); color: #fff; text-decoration: none;
      font-weight: 600; font-size: 16px; padding: 14px 26px; border-radius: 12px;
      box-shadow: 0 8px 20px color-mix(in srgb, var(--accent) 35%, transparent);
      transition: transform 0.12s ease, opacity 0.12s ease;
    }
    .btn:hover { transform: translateY(-2px); opacity: 0.95; }
    .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    @media (prefers-reduced-motion: reduce) { .btn { transition: none; } .btn:hover { transform: none; } }
  </style>
</head>
<body>
  <main class="card">
    <p class="code">404</p>
    <h1>This route returned <code>null</code></h1>
    <p class="lead">The page you were looking for doesn't exist — or it got refactored away.</p>

    <div class="term" aria-hidden="true">
<span class="accent">visitor@10x:~$</span> cd <span id="path">/the-page-you-wanted</span>
<span class="err">bash: cd: no such file or directory</span>
<span class="muted"># status: 404 · try heading home ↓</span>
    </div>

    <a class="btn" href="/">← cd ~ &nbsp;(take me home)</a>
  </main>

  <script>
    // Show the actual path that 404'd, for a little extra realism.
    try {
      var p = decodeURIComponent(location.pathname);
      if (p && p !== '/') document.getElementById('path').textContent = p;
    } catch (e) {}
  </script>
</body>
</html>
